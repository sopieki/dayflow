<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F5F5F7">
  <title>Monet — Бюджет и цели</title>
  <style>
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --surface-alt: #EFEFF3;
      --text: #121215;
      --muted: #71717A;
      --border: rgba(18, 18, 21, 0.07);
      --accent: #121215;
      --accent-fg: #FFFFFF;
      --green: #16A34A;
      --green-soft: rgba(22, 163, 74, 0.12);
      --red: #E11D48;
      --red-soft: rgba(225, 29, 72, 0.12);
      --amber: #D97706;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --shadow: 0 8px 24px rgba(18, 18, 21, 0.05);
      --sheet-bg: #FFFFFF;
      --backdrop: rgba(10, 10, 14, 0.45);
    }

    [data-theme="dark"] {
      --bg: #0B0B0E;
      --surface: #151519;
      --surface-alt: #202026;
      --text: #F4F4F6;
      --muted: #8E8E98;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #F4F4F6;
      --accent-fg: #0B0B0E;
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.15);
      --red: #FB7185;
      --red-soft: rgba(251, 113, 133, 0.15);
      --amber: #F59E0B;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      --sheet-bg: #18181D;
      --backdrop: rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100dvh;
      overflow-x: hidden;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: 18px 16px calc(108px + env(safe-area-inset-bottom));
    }

    /* Header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, #18181B 0%, #3F3F46 100%);
      color: #FFF;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.04em;
    }

    [data-theme="dark"] .logo-mark {
      background: linear-gradient(135deg, #F4F4F5 0%, #A1A1AA 100%);
      color: #0B0B0E;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-month {
      font-size: 12px;
      color: var(--muted);
      text-transform: capitalize;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .pill-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease;
    }

    .pill-btn:active {
      transform: scale(0.95);
    }

    .icon-only {
      width: 36px;
      padding: 0;
    }

    /* Screens */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeUp 0.22s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Card */
    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      padding: 22px;
      color: #FFFFFF;
      background:
        radial-gradient(circle at 88% 15%, rgba(99, 102, 241, 0.42), transparent 48%),
        radial-gradient(circle at 12% 90%, rgba(16, 185, 129, 0.30), transparent 50%),
        linear-gradient(145deg, #16161B 0%, #0D0D11 100%);
      box-shadow: 0 16px 36px rgba(15, 15, 22, 0.22);
      margin-bottom: 14px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .hero-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.02em;
    }

    .hero-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }

    .hero-balance {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 20px;
    }

    .hero-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hero-metric {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .hero-metric-lbl {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.62);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot-in { background: #34D399; }
    .dot-out { background: #FB7185; }

    .hero-metric-val {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Budget Widget */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
    }

    .card-sub {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .edit-link {
      background: var(--surface-alt);
      border: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .progress-track {
      height: 8px;
      width: 100%;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--green);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease;
    }

    .budget-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Filter Chips */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .chips-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .chips-scroll::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    /* Transactions */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .tx-item:active {
      transform: scale(0.985);
    }

    .tx-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .tx-info {
      flex: 1;
      min-width: 0;
    }

    .tx-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tx-amount.income { color: var(--green); }
    .tx-amount.expense { color: var(--text); }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    /* Analytics */
    .donut-wrap {
      position: relative;
      width: 196px;
      height: 196px;
      margin: 8px auto 20px;
      display: grid;
      place-items: center;
    }

    .donut-svg {
      width: 196px;
      height: 196px;
      transform: rotate(-90deg);
    }

    .donut-center {
      position: absolute;
      text-align: center;
    }

    .donut-center-lbl {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .donut-center-val {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .legend-right {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .legend-pct {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
      font-size: 12px;
    }

    .mini-bar {
      height: 5px;
      border-radius: 999px;
      background: var(--surface-alt);
      overflow: hidden;
    }

    .mini-bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .insights-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .insight-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .insight-lbl {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .insight-val {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* Goals */
    .goal-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .goal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .goal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .goal-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .goal-sub {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .goal-pct {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 9px;
      background: var(--surface-alt);
      font-variant-numeric: tabular-nums;
    }

    .goal-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-soft {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost-danger {
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: none;
      background: var(--red-soft);
      color: var(--red);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-full {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-outline-danger {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Floating Bottom Dock */
    .dock-wrap {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      pointer-events: none;
      z-index: 20;
    }

    .dock {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 1fr 1fr auto 1fr;
      align-items: center;
      gap: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }

    [data-theme="dark"] .dock {
      background: rgba(24, 24, 29, 0.86);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--text);
      font-weight: 600;
    }

    .nav-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fab {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      border: none;
      background: var(--accent);
      color: var(--accent-fg);
      display: grid;
      place-items: center;
      cursor: pointer;
      margin: 0 6px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      transition: transform 0.14s ease;
    }

    .fab:active {
      transform: scale(0.92);
    }

    /* Bottom Sheet Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 40;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 460px;
      background: var(--sheet-bg);
      border-radius: 26px 26px 0 0;
      padding: 12px 18px calc(22px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 92dvh;
      overflow-y: auto;
    }

    .modal-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      margin: 0 auto 14px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-alt);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .seg-btn {
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .amount-preview {
      text-align: center;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      margin: 6px 0 14px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 9px 4px;
      border-radius: 14px;
      border: 1.5px solid transparent;
      background: var(--surface-alt);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .cat-btn.active {
      border-color: var(--text);
      background: var(--surface);
    }

    .cat-emoji {
      font-size: 19px;
    }

    .sheet-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }

    .sheet-input:focus {
      border-color: var(--text);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .num-key {
      height: 48px;
      border-radius: 13px;
      border: none;
      background: var(--surface-alt);
      color: var(--text);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.1s ease, transform 0.08s ease;
    }

    .num-key:active {
      transform: scale(0.95);
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      text-align: center;
    }

    .tx-detail-box {
      background: var(--surface-alt);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: center;
    }

    .tx-detail-sum {
      font-size: 28px;
      font-weight: 700;
      margin: 6px 0 4px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="logo-mark">m.</div>
        <div>
          <div class="brand-name">monet</div>
          <div class="brand-month" id="currentMonth"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="pill-btn" id="currencyBtn" title="Сменить валюту">₸</button>
        <button class="pill-btn icon-only" id="themeBtn" aria-label="Сменить тему">☀️</button>
      </div>
    </header>

    <!-- Экран 1: Обзор -->
    <section class="screen active" id="screen-home">
      <div class="hero-card">
        <div class="hero-top">
          <span class="hero-label">Текущий баланс</span>
          <span class="hero-badge" id="savingsRateBadge">Норма</span>
        </div>
        <div class="hero-balance" id="balanceValue">0 ₸</div>
        <div class="hero-split">
          <div class="hero-metric">
            <div class="hero-metric-lbl"><span class="dot dot-in"></span>Доходы</div>
            <div class="hero-metric-val" id="incomeValue">0 ₸</div>
          </div>
          <div class="hero-metric">
            <div class="hero-metric-lbl"><span class="dot dot-out"></span>Расходы</div>
            <div class="hero-metric-val" id="expenseValue">0 ₸</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-row">
          <div>
            <div class="card-title">Месячный лимит</div>
            <div class="card-sub" id="budgetSubtitle">Потрачено 0 из 150 000</div>
          </div>
          <button class="edit-link" id="editBudgetBtn">Изменить</button>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="budgetBar" style="width: 0%"></div>
        </div>
        <div class="budget-meta">
          <span id="budgetLeftText">Осталось 0</span>
          <span id="budgetPctText">0%</span>
        </div>
      </div>

      <div class="section-head">
        <div class="section-title">Операции</div>
        <span class="card-sub" id="txCountLabel">0 записей</span>
      </div>

      <div class="chips-scroll" id="filterChips"></div>
      <div class="tx-list" id="txList"></div>
    </section>

    <!-- Экран 2: Аналитика -->
    <section class="screen" id="screen-stats">
      <div class="insights-grid">
        <div class="insight-card">
          <div class="insight-lbl">Можно в день</div>
          <div class="insight-val" id="dailySafeVal">0 ₸</div>
        </div>
        <div class="insight-card">
          <div class="insight-lbl">Средний чек</div>
          <div class="insight-val" id="avgCheckVal">0 ₸</div>
        </div>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="card-title">Структура расходов</div>
          <span class="card-sub" id="topCategoryLabel">—</span>
        </div>

        <div class="donut-wrap">
          <svg class="donut-svg" viewBox="0 0 180 180" id="donutSvg"></svg>
          <div class="donut-center">
            <div class="donut-center-lbl">Расходы</div>
            <div class="donut-center-val" id="donutTotal">0</div>
          </div>
        </div>

        <div class="legend-list" id="legendList"></div>
      </div>
    </section>

    <!-- Экран 3: Цели -->
    <section class="screen" id="screen-goals">
      <div class="section-head">
        <div class="section-title">Копилка и цели</div>
        <span class="card-sub" id="goalsSummary">0 накоплено</span>
      </div>

      <div class="goal-list" id="goalList"></div>
      <button class="btn-full" id="openNewGoalBtn">+ Новая цель</button>
      <button class="btn-outline-danger" id="resetDemoBtn">Очистить всё и начать с нуля</button>
    </section>
  </div>

  <!-- Нижняя панель -->
  <div class="dock-wrap">
    <nav class="dock">
      <button class="nav-btn active" data-tab="home">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>
        <span>Обзор</span>
      </button>
      <button class="nav-btn" data-tab="stats">
        <svg viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        <span>Анализ</span>
      </button>
      <button class="fab" id="openAddTxBtn" aria-label="Добавить операцию">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="nav-btn" data-tab="goals">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>
        <span>Цели</span>
      </button>
    </nav>
  </div>

  <!-- Шторка: Новая операция -->
  <div class="modal-backdrop" id="txModal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="segmented">
        <button class="seg-btn active" data-type="expense">Расход</button>
        <button class="seg-btn" data-type="income">Доход</button>
      </div>

      <div class="amount-preview" id="amountPreview">0 ₸</div>
      <div class="cat-grid" id="catGrid"></div>
      <input type="text" class="sheet-input" id="txNoteInput" placeholder="Комментарий (например, латте или такси)" maxlength="45">

      <div class="numpad" id="numpad">
        <button class="num-key" data-key="1">1</button>
        <button class="num-key" data-key="2">2</button>
        <button class="num-key" data-key="3">3</button>
        <button class="num-key" data-key="4">4</button>
        <button class="num-key" data-key="5">5</button>
        <button class="num-key" data-key="6">6</button>
        <button class="num-key" data-key="7">7</button>
        <button class="num-key" data-key="8">8</button>
        <button class="num-key" data-key="9">9</button>
        <button class="num-key" data-key="00">00</button>
        <button class="num-key" data-key="0">0</button>
        <button class="num-key" data-key="back">⌫</button>
      </div>

      <button class="btn-full" id="saveTxBtn">Сохранить</button>
    </div>
  </div>

  <!-- Шторка: Лимит / Цель / Детали -->
  <div class="modal-backdrop" id="utilityModal">
    <div class="sheet" id="utilitySheetBody"></div>
  </div>

  <script>
    const CATEGORIES = {
      food:      { label: 'Еда',       emoji: '🥗', color: '#F97316', bg: 'rgba(249,115,22,0.14)', type: 'expense' },
      coffee:    { label: 'Кофе',      emoji: '☕', color: '#8B5CF6', bg: 'rgba(139,92,246,0.14)', type: 'expense' },
      transport: { label: 'Транспорт', emoji: '🚕', color: '#0EA5E9', bg: 'rgba(14,165,233,0.14)', type: 'expense' },
      shopping:  { label: 'Шопинг',    emoji: '🛍️', color: '#EC4899', bg: 'rgba(236,72,153,0.14)', type: 'expense' },
      subs:      { label: 'Подписки',  emoji: '⚡', color: '#EAB308', bg: 'rgba(234,179,8,0.14)',  type: 'expense' },
      health:    { label: 'Здоровье',  emoji: '💊', color: '#14B8A6', bg: 'rgba(20,184,166,0.14)', type: 'expense' },
      fun:       { label: 'Досуг',     emoji: '🎮', color: '#6366F1', bg: 'rgba(99,102,241,0.14)', type: 'expense' },
      other:     { label: 'Другое',    emoji: '📦', color: '#71717A', bg: 'rgba(113,113,122,0.14)',type: 'expense' },
      salary:    { label: 'Зарплата',  emoji: '💼', color: '#16A34A', bg: 'rgba(22,163,74,0.14)',  type: 'income'  },
      freelance: { label: 'Фриланс',   emoji: '💻', color: '#10B981', bg: 'rgba(16,185,129,0.14)', type: 'income'  },
      gift:      { label: 'Подарок',   emoji: '🎁', color: '#22C55E', bg: 'rgba(34,197,94,0.14)',  type: 'income'  },
      cashback:  { label: 'Кэшбэк',    emoji: '✨', color: '#059669', bg: 'rgba(5,150,105,0.14)',  type: 'income'  }
    };

    const CURRENCIES = ['₸', '₽', '$'];
    const STORAGE_KEY = 'monet_app_v1';

    function getDemoState() {
      const now = Date.now();
      const hr = 3600000;
      return {
        currency: '₸',
        budgetLimit: 120000,
        transactions: [
          { id: now - 1, type: 'income',  category: 'freelance', amount: 185000, note: 'Дизайн лендинга', date: now - hr * 48 },
          { id: now - 2, type: 'expense', category: 'coffee',    amount: 2400,   note: 'Айс-латте с сиропом', date: now - hr * 2 },
          { id: now - 3, type: 'expense', category: 'food',      amount: 8900,   note: 'Продукты и фрукты', date: now - hr * 8 },
          { id: now - 4, type: 'expense', category: 'transport', amount: 1650,   note: 'Такси до центра', date: now - hr * 15 },
          { id: now - 5, type: 'expense', category: 'subs',      amount: 6500,   note: 'Figma & музыка', date: now - hr * 26 },
          { id: now - 6, type: 'expense', category: 'shopping',  amount: 24500,  note: 'Кроссовки', date: now - hr * 36 }
        ],
        goals: [
          { id: 101, name: 'Новый монитор', target: 180000, current: 95000 },
          { id: 102, name: 'Поездка летом', target: 350000, current: 110000 }
        ]
      };
    }

    let state = (() => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : getDemoState();
      } catch {
        return getDemoState();
      }
    })();

    let activeFilter = 'all';
    let draftType = 'expense';
    let draftCat = 'coffee';
    let draftAmount = '0';

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function fmtMoney(num) {
      const sign = num < 0 ? '−' : '';
      const formatted = Math.abs(Math.round(num)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return `${sign}${formatted} ${state.currency}`;
    }

    function fmtDate(ts) {
      return new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ts));
    }

    // Шапка: месяц и тема
    document.getElementById('currentMonth').textContent = new Intl.DateTimeFormat('ru-RU', {
      month: 'long', year: 'numeric'
    }).format(new Date());

    const themeBtn = document.getElementById('themeBtn');
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('monet_theme', theme);
    }
    applyTheme(localStorage.getItem('monet_theme') || 'light');
    themeBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    document.getElementById('currencyBtn').addEventListener('click', () => {
      const idx = CURRENCIES.indexOf(state.currency);
      state.currency = CURRENCIES[(idx + 1) % CURRENCIES.length];
      saveState();
      renderAll();
    });

    // Навигация
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`screen-${btn.dataset.tab}`).classList.add('active');
      });
    });

    // Рендер обзора
    function renderHome() {
      document.getElementById('currencyBtn').textContent = state.currency;
      const income = state.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const expense = state.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      const balance = income - expense;

      document.getElementById('balanceValue').textContent = fmtMoney(balance);
      document.getElementById('incomeValue').textContent = `+${fmtMoney(income)}`;
      document.getElementById('expenseValue').textContent = `−${fmtMoney(expense)}`;

      const saveRate = income > 0 ? Math.round(((income - expense) / income) * 100) : 0;
      const badge = document.getElementById('savingsRateBadge');
      badge.textContent = income > 0 ? `Сохранено ${Math.max(0, saveRate)}%` : 'Без доходов';

      // Бюджет
      const limit = Math.max(1, state.budgetLimit);
      const pct = Math.round((expense / limit) * 100);
      const bar = document.getElementById('budgetBar');
      bar.style.width = `${Math.min(100, pct)}%`;
      bar.style.background = pct >= 95 ? 'var(--red)' : pct >= 75 ? 'var(--amber)' : 'var(--green)';

      document.getElementById('budgetSubtitle').textContent = `${fmtMoney(expense)} из ${fmtMoney(state.budgetLimit)}`;
      const left = state.budgetLimit - expense;
      document.getElementById('budgetLeftText').textContent = left >= 0 ? `Осталось ${fmtMoney(left)}` : `Перерасход ${fmtMoney(Math.abs(left))}`;
      document.getElementById('budgetPctText').textContent = `${pct}%`;

      // Фильтры
      const filterDefs = [
        { id: 'all', label: 'Все' },
        { id: 'expense', label: 'Расходы' },
        { id: 'income', label: 'Доходы' },
        { id: 'food', label: 'Еда' },
        { id: 'coffee', label: 'Кофе' },
        { id: 'transport', label: 'Транспорт' },
        { id: 'shopping', label: 'Шопинг' }
      ];

      const chipsEl = document.getElementById('filterChips');
      chipsEl.innerHTML = filterDefs.map(f => `
        <button class="chip ${activeFilter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>
      `).join('');

      chipsEl.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          renderHome();
        });
      });

      // Список операций
      const filtered = state.transactions
        .filter(t => {
          if (activeFilter === 'all') return true;
          if (activeFilter === 'income' || activeFilter === 'expense') return t.type === activeFilter;
          return t.category === activeFilter;
        })
        .sort((a, b) => b.date - a.date);

      document.getElementById('txCountLabel').textContent = `${filtered.length} зап.`;
      const listEl = document.getElementById('txList');

      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty-state">Операций по этому фильтру пока нет.<br>Нажми «+» внизу, чтобы добавить первую.</div>';
        return;
      }

      listEl.innerHTML = filtered.map(t => {
        const cat = CATEGORIES[t.category] || CATEGORIES.other;
        const sign = t.type === 'income' ? '+' : '−';
        return `
          <div class="tx-item" data-id="${t.id}">
            <div class="tx-icon" style="background:${cat.bg}">${cat.emoji}</div>
            <div class="tx-info">
              <div class="tx-title">${escapeHtml(t.note || cat.label)}</div>
              <div class="tx-meta">${cat.label} · ${fmtDate(t.date)}</div>
            </div>
            <div class="tx-amount ${t.type}">${sign}${fmtMoney(t.amount)}</div>
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('.tx-item').forEach(el => {
        el.addEventListener('click', () => openTxDetail(Number(el.dataset.id)));
      });
    }

    // Рендер аналитики + SVG Donut
    function renderStats() {
      const expenses = state.transactions.filter(t => t.type === 'expense');
      const totalExp = expenses.reduce((s, t) => s + t.amount, 0);

      // Дни до конца месяца
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = Math.max(1, daysInMonth - now.getDate() + 1);
      const remainingBudget = Math.max(0, state.budgetLimit - totalExp);

      document.getElementById('dailySafeVal').textContent = fmtMoney(remainingBudget / daysLeft);
      document.getElementById('avgCheckVal').textContent = expenses.length ? fmtMoney(totalExp / expenses.length) : fmtMoney(0);
      document.getElementById('donutTotal').textContent = fmtMoney(totalExp);

      const byCat = {};
      expenses.forEach(t => {
        byCat[t.category] = (byCat[t.category] || 0) + t.amount;
      });

      const segments = Object.entries(byCat)
        .map(([key, val]) => ({ key, val, cat: CATEGORIES[key] || CATEGORIES.other }))
        .sort((a, b) => b.val - a.val);

      document.getElementById('topCategoryLabel').textContent = segments.length ? `Топ: ${segments[0].cat.label}` : 'Нет данных';

      const svg = document.getElementById('donutSvg');
      const legend = document.getElementById('legendList');
      const r = 68;
      const circ = 2 * Math.PI * r;

      if (!segments.length) {
        svg.innerHTML = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--surface-alt)" stroke-width="20" />`;
        legend.innerHTML = '<div class="empty-state">Добавь расходы, чтобы увидеть распределение по категориям.</div>';
        return;
      }

      let offset = 0;
      const gap = segments.length > 1 ? 3 : 0;
      svg.innerHTML = segments.map(seg => {
        const rawDash = (seg.val / totalExp) * circ;
        const dash = Math.max(2, rawDash - gap);
        const circle = `
          <circle
            cx="90" cy="90" r="${r}"
            fill="none"
            stroke="${seg.cat.color}"
            stroke-width="20"
            stroke-dasharray="${dash} ${circ}"
            stroke-dashoffset="${-offset}"
            stroke-linecap="butt"
          />`;
        offset += rawDash;
        return circle;
      }).join('');

      legend.innerHTML = segments.map(seg => {
        const pct = Math.round((seg.val / totalExp) * 100);
        return `
          <div class="legend-item">
            <div class="legend-row">
              <div class="legend-left">
                <span class="legend-dot" style="background:${seg.cat.color}"></span>
                <span>${seg.cat.emoji} ${seg.cat.label}</span>
              </div>
              <div class="legend-right">
                ${fmtMoney(seg.val)}<span class="legend-pct">${pct}%</span>
              </div>
            </div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width:${pct}%; background:${seg.cat.color}"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Рендер целей
    function renderGoals() {
      const totalSaved = state.goals.reduce((s, g) => s + g.current, 0);
      document.getElementById('goalsSummary').textContent = `${fmtMoney(totalSaved)} всего`;

      const listEl = document.getElementById('goalList');
      if (!state.goals.length) {
        listEl.innerHTML = '<div class="empty-state">Целей пока нет. Создай первую копилку ниже.</div>';
        return;
      }

      listEl.innerHTML = state.goals.map(g => {
        const pct = Math.min(100, Math.round((g.current / Math.max(1, g.target)) * 100));
        return `
          <div class="goal-card">
            <div class="goal-top">
              <div>
                <div class="goal-name">${escapeHtml(g.name)}</div>
                <div class="goal-sub">${fmtMoney(g.current)} из ${fmtMoney(g.target)}</div>
              </div>
              <div class="goal-pct">${pct}%</div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%; background: ${pct >= 100 ? 'var(--green)' : '#6366F1'}"></div>
            </div>
            <div class="goal-actions">
              <button class="btn-soft" onclick="topUpGoal(${g.id}, 5000)">+5 000</button>
              <button class="btn-soft" onclick="topUpGoal(${g.id}, 15000)">+15 000</button>
              <button class="btn-ghost-danger" onclick="deleteGoal(${g.id})">Удалить</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.topUpGoal = (id, delta) => {
      state.goals = state.goals.map(g => g.id === id ? { ...g, current: Math.min(g.target, g.current + delta) } : g);
      saveState();
      renderGoals();
    };

    window.deleteGoal = (id) => {
      state.goals = state.goals.filter(g => g.id !== id);
      saveState();
      renderGoals();
    };

    // Шторка добавления операции
    const txModal = document.getElementById('txModal');
    const utilityModal = document.getElementById('utilityModal');

    function renderCatGrid() {
      const entries = Object.entries(CATEGORIES).filter(([, c]) => c.type === draftType);
      if (!entries.some(([k]) => k === draftCat)) draftCat = entries[0][0];

      const grid = document.getElementById('catGrid');
      grid.innerHTML = entries.map(([key, c]) => `
        <button class="cat-btn ${draftCat === key ? 'active' : ''}" data-cat="${key}">
          <span class="cat-emoji">${c.emoji}</span>
          <span>${c.label}</span>
        </button>
      `).join('');

      grid.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          draftCat = btn.dataset.cat;
          renderCatGrid();
        });
      });
    }

    function updateAmountPreview() {
      const val = Number(draftAmount) || 0;
      const prefix = draftType === 'income' ? '+' : '−';
      const el = document.getElementById('amountPreview');
      el.textContent = `${val > 0 ? prefix : ''}${fmtMoney(val)}`;
      el.style.color = draftType === 'income' ? 'var(--green)' : 'var(--text)';
    }

    document.getElementById('openAddTxBtn').addEventListener('click', () => {
      draftAmount = '0';
      draftType = 'expense';
      draftCat = 'coffee';
      document.getElementById('txNoteInput').value = '';
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'expense'));
      renderCatGrid();
      updateAmountPreview();
      txModal.classList.add('open');
    });

    document.querySelectorAll('.seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        draftType = btn.dataset.type;
        document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCatGrid();
        updateAmountPreview();
      });
    });

    document.getElementById('numpad').addEventListener('click', e => {
      const btn = e.target.closest('.num-key');
      if (!btn) return;
      const key = btn.dataset.key;
      if (key === 'back') {
        draftAmount = draftAmount.length > 1 ? draftAmount.slice(0, -1) : '0';
      } else {
        if (draftAmount === '0') {
          draftAmount = key === '00' ? '0' : key;
        } else if (draftAmount.length + key.length <= 9) {
          draftAmount += key;
        }
      }
      updateAmountPreview();
    });

    document.getElementById('saveTxBtn').addEventListener('click', () => {
      const amount = Number(draftAmount);
      if (!amount || amount <= 0) return;
      const note = document.getElementById('txNoteInput').value.trim();
      state.transactions.unshift({
        id: Date.now(),
        type: draftType,
        category: draftCat,
        amount,
        note,
        date: Date.now()
      });
      saveState();
      txModal.classList.remove('open');
      renderAll();
    });

    // Универсальная шторка (детали операции, лимит, новая цель)
    function openUtilitySheet(html) {
      document.getElementById('utilitySheetBody').innerHTML = `<div class="sheet-handle"></div>${html}`;
      utilityModal.classList.add('open');
    }

    function openTxDetail(id) {
      const tx = state.transactions.find(t => t.id === id);
      if (!tx) return;
      const cat = CATEGORIES[tx.category] || CATEGORIES.other;
      const sign = tx.type === 'income' ? '+' : '−';
      openUtilitySheet(`
        <div class="tx-detail-box">
          <div style="font-size:32px">${cat.emoji}</div>
          <div class="tx-detail-sum" style="color:${tx.type === 'income' ? 'var(--green)' : 'var(--text)'}">${sign}${fmtMoney(tx.amount)}</div>
          <div style="font-weight:600; margin-bottom:4px">${escapeHtml(tx.note || cat.label)}</div>
          <div class="card-sub">${cat.label} · ${fmtDate(tx.date)}</div>
        </div>
        <button class="btn-full" style="background:var(--red); color:#FFF" id="confirmDeleteTxBtn">Удалить операцию</button>
      `);
      document.getElementById('confirmDeleteTxBtn').addEventListener('click', () => {
        state.transactions = state.transactions.filter(t => t.id !== id);
        saveState();
        utilityModal.classList.remove('open');
        renderAll();
      });
    }

    document.getElementById('editBudgetBtn').addEventListener('click', () => {
      openUtilitySheet(`
        <div class="sheet-title">Лимит расходов на месяц</div>
        <input type="number" class="sheet-input" id="budgetInput" value="${state.budgetLimit}" min="1000" step="1000" placeholder="Например, 150000">
        <button class="btn-full" id="saveBudgetBtn">Сохранить лимит</button>
      `);
      document.getElementById('saveBudgetBtn').addEventListener('click', () => {
        const val = Number(document.getElementById('budgetInput').value);
        if (val > 0) {
          state.budgetLimit = val;
          saveState();
          utilityModal.classList.remove('open');
          renderAll();
        }
      });
    });

    document.getElementById('openNewGoalBtn').addEventListener('click', () => {
      openUtilitySheet(`
        <div class="sheet-title">Новая цель</div>
        <input type="text" class="sheet-input" id="goalNameInput" placeholder="Название (например, iPad)" maxlength="32">
        <input type="number" class="sheet-input" id="goalTargetInput" placeholder="Сумма цели" min="1000">
        <button class="btn-full" id="saveGoalBtn">Создать цель</button>
      `);
      document.getElementById('saveGoalBtn').addEventListener('click', () => {
        const name = document.getElementById('goalNameInput').value.trim();
        const target = Number(document.getElementById('goalTargetInput').value);
        if (!name || !target || target <= 0) return;
        state.goals.unshift({ id: Date.now(), name, target, current: 0 });
        saveState();
        utilityModal.classList.remove('open');
        renderGoals();
      });
    });

    document.getElementById('resetDemoBtn').addEventListener('click', () => {
      openUtilitySheet(`
        <div class="sheet-title">Очистить все данные?</div>
        <p class="card-sub" style="text-align:center; margin-bottom:16px">Удалятся все операции и цели, после чего можно вести свой чистый учёт.</p>
        <button class="btn-full" style="background:var(--red); color:#FFF" id="confirmClearAll">Да, очистить</button>
      `);
      document.getElementById('confirmClearAll').addEventListener('click', () => {
        state.transactions = [];
        state.goals = [];
        saveState();
        utilityModal.classList.remove('open');
        renderAll();
      });
    });

    // Закрытие шторок по клику на фон
    [txModal, utilityModal].forEach(modal => {
      modal.addEventListener('click', e => {
        if (e.target === modal) modal.classList.remove('open');
      });
    });

    function renderAll() {
      renderHome();
      renderStats();
      renderGoals();
    }

    renderAll();
  </script>
</body>
</html>
